
media:
  - name: images
    label: "புகைப்படங்கள் | Photographs"
    input: images
    output: /images

  - name: documents
    label: "PDF ஆவணங்கள் | PDF Documents"
    input: documents
    output: /documents
    extensions: [pdf]

content:
  - name: news
    label: "செய்திகள் | News"
    type: file
    path: public/content/news.json
    format: json
    list: true

    fields:
      - name: id
        type: number
        hidden: true

      - name: titleTamil
        label: "தமிழ் தலைப்பு"
        type: string
        required: true

      - name: titleEnglish
        label: "English Title"
        type: string

      - name: date
        label: "திகதி | Date"
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: dateDisplay
        type: string
        hidden: true

      - name: category
        label: "பிரிவு | Category"
        type: select
        required: true
        options:
          values:
            - "Achievements"
            - "School Events"
            - "Academic & Awards"
            - "Welfare"
            - "Sports"
            - "Cultural"
            - "General"
            - "Other"

      - name: image
        label: "புகைப்படம் | Photograph"
        type: image
        options:
          media: images

      - name: description
        label: "செய்தி விபரம்"
        type: text
        required: true

      - name: detailsUrl
        label: "மேலதிக விபரம் | Details Link"
        type: string

      - name: readMoreText
        type: string
        hidden: true


  - name: events
    label: "நிகழ்வுகள் | Events"
    type: file
    path: public/content/events.json
    format: json
    list: true

    fields:
      - name: id
        type: number
        hidden: true

      - name: titleTamil
        label: "தமிழ் தலைப்பு"
        type: string
        required: true

      - name: titleEnglish
        label: "English Title"
        type: string

      - name: date
        label: "திகதி | Date"
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: time
        label: "நேரம் | Time"
        type: string

      - name: venue
        label: "இடம் | Venue"
        type: string

      - name: category
        label: "பிரிவு | Category"
        type: select
        required: true
        options:
          values:
            - "Academic"
            - "Cultural"
            - "Examinations"
            - "Sports"
            - "School Event"
            - "Welfare"
            - "Other"

      - name: status
        type: string
        hidden: true

      - name: description
        label: "நிகழ்வு விபரம்"
        type: text
        required: true

      - name: link
        label: "மேலதிக விபரம் | Details Link"
        type: string

      - name: linkText
        label: "Button Text"
        type: string


  - name: announcements
    label: "அறிவித்தல்கள் | Announcements"
    type: file
    path: public/content/announcements.json
    format: json
    list: true

    fields:
      - name: titleTamil
        label: "தமிழ் அறிவித்தல்"
        type: text
        required: true

      - name: titleEnglish
        label: "English Announcement"
        type: text

      - name: publishDate
        label: "வெளியிடும் திகதி | Publish Date"
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: expiryDate
        label: "முடிவுத் திகதி | Expiry Date"
        type: date
        options:
          format: yyyy-MM-dd

      - name: important
        label: "முக்கிய அறிவித்தல் | Important"
        type: boolean

      - name: active
        label: "Show Announcement"
        type: boolean
        default: true

      - name: link
        label: "மேலதிக விபரம் | Details Link"
        type: string


  - name: gallery
    label: "புகைப்படத் தொகுப்பு | Gallery"
    type: file
    path: public/content/gallery.json
    format: json
    list: true

    fields:
      - name: titleEnglish
        label: "தொகுப்பின் தலைப்பு | Album Title"
        type: string
        required: true

      - name: photos
        label: "புகைப்படங்கள் | Photographs"
        type: object
        list: true

        fields:
          - name: image
            label: "புகைப்படம் | Photograph"
            type: image
            required: true
            options:
              media: images

          - name: title
            label: "புகைப்படத் தலைப்பு | Photo Title"
            type: string

          - name: category
            label: "பிரிவு | Category"
            type: string

          - name: caption
            label: "புகைப்பட விபரம் | Photo Caption"
            type: text

          - name: imageOnly
            label: "Image Only"
            type: boolean
            default: false


  - name: resources
    label: "ஆவணங்கள் | Resources"
    type: file
    path: public/content/resources.json
    format: json
    list: true

    fields:
      - name: title
        label: "ஆவணத் தலைப்பு | Document Title"
        type: string
        required: true

      - name: category
        label: "பிரிவு | Category"
        type: select
        required: true
        options:
          values:
            - "Publications"
            - "Development Plans"
            - "Prize Day Reports"
            - "School History"
            - "Staff Directory"
            - "Student Activities"
            - "Student Welfare"
            - "Infrastructure"
            - "Application Forms"
            - "Educational Resources"
            - "Other"

      - name: description
        label: "விபரம் | Description"
        type: text

      - name: file
        label: "ஆவணம் | PDF Document"
        type: file
        required: true
        options:
          media: documents
          extensions: [pdf]
          rename: safe
