media:
  input: images
  output: /images

content:
  - name: news
    label: "செய்திகள் | News"
    type: file
    path: public/content/news.json
    format: json
    list: true

    fields:
      - name: id
        type: number
        hidden: true

      - name: titleTamil
        label: "தமிழ் தலைப்பு"
        type: string
        required: true

      - name: titleEnglish
        label: "English Title"
        type: string

      - name: date
        label: "திகதி | Date"
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: dateDisplay
        type: string
        hidden: true

      - name: category
        label: "பிரிவு | Category"
        type: select
        required: true
        options:
          values:
            - "Achievements"
            - "School Events"
            - "Academic & Awards"
            - "Welfare"
            - "Sports"
            - "Cultural"
            - "General"
            - "Other"

      - name: image
        label: "புகைப்படம் | Photograph"
        type: image

      - name: description
        label: "செய்தி விபரம்"
        type: text
        required: true

      - name: detailsUrl
        label: "மேலதிக விபரம் | Details Link"
        type: string

      - name: readMoreText
        type: string
        hidden: true